<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de FontAwesome para los campos y redes sociales -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="container">
        <!-- Panel Izquierdo (Mensaje de Bienvenida) -->
        <div class="panel-left">
            <h1>¡Hola, Bienvenid@!</h1>
            <p>"Inventario al dia: el secreto de un buen pan y un negocio sano."</p>
        </div>

        <!-- Panel Derecho (Formulario de Registro sin Email ni botón Iniciar Sesión) -->
        <div class="panel-right">
            <h1>BAKESTOCK</h1>

            <p class="subtitle">registrarse</p>

            <!-- Formulario -->
<form onsubmit="return validarLogin(event)" autocomplete="off">
    <!-- Grupo de Usuario -->
    <div class="input-group-vertical">
        <label for="nombre">Usuario</label>
        <div class="input-field">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="nombre" name="nombre" autocomplete="off" required>
        </div>
    </div>

    <!-- Grupo de Contraseña -->
    <div class="input-group-vertical">
        <label for="password">Contraseña</label>
        <div class="input-field">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
    </div>

    <!-- Mensaje de error -->
    <p id="error-msg" style="color:#C85A32; font-size:0.85rem; display:none; margin-top:-8px;">
        ❌ Usuario o contraseña incorrectos
    </p>

    <button type="submit" class="btn-register">LOGIN</button>
</form>

<script>
    function validarLogin(e) {
        e.preventDefault();
        const usuario = document.getElementById('nombre').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (usuario === 'villa' && password === 'villa_stock') {
            window.location.href = 'clasificacion.php';
        } else {
            errorMsg.style.display = 'block';
        }
        return false;
    }
</script>
        </div>
    </div>

</body>
</html>
